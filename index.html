<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Dev Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,680;1,9..144,560&family=Outfit:wght@380;500;640&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="identity">
          <p class="eyebrow">Production board</p>
          <input
            id="game-title"
            class="title-input"
            type="text"
            maxlength="80"
            aria-label="Game title"
            placeholder="Untitled game"
            autocomplete="off"
          />
          <input
            id="game-logline"
            class="logline-input"
            type="text"
            maxlength="160"
            aria-label="Logline"
            placeholder="What are you making?"
            autocomplete="off"
          />
        </div>
        <div class="ship">
          <label class="ship-date">
            <span>Target</span>
            <input id="ship-date" type="date" aria-label="Target date" />
          </label>
          <p id="ship-note" class="ship-note"></p>
          <div class="ring" id="overall-ring" style="--p: 0">
            <span id="overall-pct">0%</span>
          </div>
        </div>
      </header>

      <p id="overall-copy" class="overall-copy"></p>

      <section class="areas" id="areas" aria-label="Disciplines"></section>

      <div class="workspace">
        <aside class="milestones-panel">
          <div class="panel-head">
            <h2>Milestones</h2>
            <button type="button" class="text-btn" id="clear-milestone-filter" hidden>
              Show all
            </button>
          </div>
          <ul id="milestones" class="milestone-list"></ul>
          <form id="milestone-form" class="stack-form">
            <input
              name="title"
              type="text"
              maxlength="80"
              placeholder="New milestone"
              aria-label="Milestone title"
              required
              autocomplete="off"
            />
            <input name="date" type="date" aria-label="Milestone date" />
            <button type="submit" class="primary">Add milestone</button>
          </form>
        </aside>

        <main class="board-panel">
          <form id="task-form" class="task-form">
            <input
              name="title"
              type="text"
              maxlength="140"
              placeholder="Add a task"
              aria-label="Task title"
              required
              autocomplete="off"
            />
            <select name="area" aria-label="Discipline">
              <option value="code">Code</option>
              <option value="art">Art</option>
              <option value="design">Design</option>
              <option value="audio">Audio</option>
            </select>
            <select name="milestone" aria-label="Milestone"></select>
            <button type="submit" class="primary">Add task</button>
          </form>

          <div class="board" id="board"></div>
        </main>
      </div>

      <footer class="foot">
        <p>Saved in this browser on this computer.</p>
        <div class="foot-actions">
          <button type="button" class="text-btn" id="load-sample">Load sample game</button>
          <button type="button" class="text-btn danger" id="start-fresh">Start fresh</button>
        </div>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
